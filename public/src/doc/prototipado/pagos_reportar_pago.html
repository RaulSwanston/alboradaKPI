<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reportar Nuevo Pago - Portal Alborada</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2563eb",
                        "gurkha-900": "#111827","gurkha-700": "#374151","gurkha-100": "#f3f4f6","gurkha-50": "#f9fafb","border-subtle": "#e5e7eb",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }.pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-gurkha-100 font-display text-gurkha-900 antialiased min-h-screen flex flex-col">
<header class="flex items-center gap-4 bg-gurkha-100 p-4 pt-6 sticky top-0 z-10">
<button class="flex items-center justify-center rounded-full bg-white shadow-sm h-10 w-10 text-gurkha-900 hover:bg-gray-50 transition-colors border border-border-subtle">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<h1 class="text-gurkha-900 text-xl font-bold leading-tight tracking-[-0.015em]">Reportar Pago</h1>
</header>
<main class="flex-1 flex flex-col px-4 py-2 pb-32">
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-5 rounded-2xl bg-white p-5 shadow-[0_1px_3px_rgba(0,0,0,0.05)] border border-border-subtle">
<div class="flex flex-col gap-2">
<label class="text-sm font-bold text-gurkha-700" for="amount">Monto</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="text-gurkha-700 font-bold text-lg">$</span>
</div>
<input class="block w-full rounded-xl border-border-subtle bg-gurkha-50 pl-9 pr-4 py-3.5 text-lg font-bold text-gurkha-900 placeholder:text-gray-400 focus:border-primary focus:ring-primary shadow-sm" id="amount" name="amount" placeholder="0.00" type="number"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-bold text-gurkha-700" for="date">Fecha</label>
<div class="relative">
<input class="block w-full rounded-xl border-border-subtle bg-gurkha-50 px-4 py-3.5 text-base font-medium text-gurkha-900 focus:border-primary focus:ring-primary shadow-sm appearance-none min-h-[54px]" id="date" name="date" type="date"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-bold text-gurkha-700" for="notes">Notas</label>
<textarea class="block w-full rounded-xl border-border-subtle bg-gurkha-50 px-4 py-3 text-base font-medium text-gurkha-900 placeholder:text-gray-400 focus:border-primary focus:ring-primary shadow-sm resize-none" id="notes" name="notes" placeholder="Escribe detalles adicionales aquí..." rows="4"></textarea>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-bold text-gurkha-700 px-1">Comprobante</label>
<button class="group relative flex w-full flex-col items-center justify-center gap-3 rounded-2xl border-2 border-dashed border-gray-300 bg-white hover:bg-gurkha-50 py-8 px-4 text-center transition-all hover:border-primary" type="button">
<div class="flex h-12 w-12 items-center justify-center rounded-full bg-gurkha-50 shadow-sm ring-1 ring-gray-100 group-hover:bg-blue-50 group-hover:ring-primary/20 transition-colors">
<span class="material-symbols-outlined text-primary text-2xl">add_photo_alternate</span>
</div>
<div class="flex flex-col gap-0.5">
<span class="text-sm font-bold text-gurkha-900 group-hover:text-primary transition-colors">Adjuntar Imagen</span>
<span class="text-xs font-medium text-gurkha-700">Sube foto del comprobante</span>
</div>
</button>
</div>
</form>
</main>
<div class="fixed bottom-0 left-0 w-full bg-white border-t border-border-subtle p-4 pb-safe z-20 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
<button class="w-full rounded-xl bg-primary py-4 text-center text-base font-bold text-white shadow-md hover:bg-blue-700 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">send</span>
            Reportar Pago
        </button>
</div>

</body></html>
