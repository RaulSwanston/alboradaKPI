<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reportar Pago - Alborada Azure</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#f3f4f6",
                        "tertiary": "#ea580c",
                        "on-secondary-container": "#111827",
                        "inverse-surface": "#111827",
                        "secondary-fixed-dim": "#e5e7eb",
                        "surface": "#ffffff",
                        "error-container": "#fee2e2",
                        "surface-dim": "#f3f4f6",
                        "on-error-container": "#991b1b",
                        "on-primary-fixed": "#1e3a8a",
                        "primary-fixed": "#dbeafe",
                        "inverse-primary": "#93c5fd",
                        "surface-container-high": "#f3f4f6",
                        "surface-tint": "#2563eb",
                        "tertiary-fixed-dim": "#fed7aa",
                        "surface-container-low": "#ffffff",
                        "primary-fixed-dim": "#bfdbfe",
                        "on-surface-variant": "#374151",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#1e40af",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#ffedd5",
                        "background": "#f3f4f6",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#f3f4f6",
                        "outline-variant": "#f3f4f6",
                        "on-surface": "#111827",
                        "surface-bright": "#ffffff",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffedd5",
                        "surface-container-highest": "#f3f4f6",
                        "outline": "#e5e7eb",
                        "on-secondary-fixed": "#111827",
                        "surface-variant": "#f3f4f6",
                        "primary": "#2563eb",
                        "on-secondary-fixed-variant": "#374151",
                        "on-tertiary-fixed-variant": "#9a3412",
                        "surface-container": "#f3f4f6",
                        "inverse-on-surface": "#ffffff",
                        "secondary": "#374151",
                        "primary-container": "#eff6ff",
                        "on-tertiary-fixed": "#431407",
                        "on-tertiary-container": "#9a3412",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#1d4ed8",
                        "on-background": "#111827",
                        "error": "#dc2626"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .split-surface-header {
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen text-on-background">
<!-- TopAppBar Integrated with Split Surface -->
<header class="w-full top-0 sticky z-50 split-surface-header text-white pt-2">
<div class="flex items-center justify-between px-4 h-16 w-full">
<div class="flex items-center gap-4">
<button class="p-2 active:scale-95 duration-200 transition-colors hover:bg-white/10 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Manrope'] font-bold text-[20px] tracking-tight">Reportar Pago</h1>
</div>
<div class="flex items-center">
<span class="text-[10px] font-bold tracking-widest text-blue-100 uppercase opacity-80">MODO ADMINISTRADOR</span>
</div>
</div>
<!-- Upper Form Section (Integrated into Azure Header) -->
<div class="px-6 pb-8 pt-4">
<label class="block text-blue-100 text-[12px] font-bold tracking-wider uppercase mb-1">MONTO DE LA TRANSACCIÓN</label>
<div class="relative flex items-center">
<span class="absolute left-0 text-white text-3xl font-extrabold opacity-70">$</span>
<input class="w-full bg-transparent border-none text-white text-5xl font-extrabold focus:ring-0 placeholder:text-blue-300/50 p-0 pl-6 selection:bg-blue-400" placeholder="0.00" type="number"/>
</div>
</div>
</header>
<main class="relative -mt-4 bg-white rounded-t-[2rem] min-h-[calc(100vh-240px)] shadow-xl overflow-hidden">
<!-- Form Content -->
<div class="flex flex-col">
<!-- Date Field -->
<div class="group px-6 py-6 border-b border-outline-variant hover:bg-gray-50 transition-colors">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-xl bg-primary-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="calendar_today">calendar_today</span>
</div>
<div class="flex-1">
<label class="block text-[12px] font-bold text-secondary tracking-wider uppercase mb-0.5">Fecha del Pago</label>
<input class="w-full bg-transparent border-none p-0 text-on-surface font-semibold focus:ring-0" type="date" value="2023-10-27"/>
</div>
</div>
</div>
<!-- Notes Field -->
<div class="group px-6 py-6 border-b border-outline-variant hover:bg-gray-50 transition-colors">
<div class="flex items-start gap-4">
<div class="w-12 h-12 rounded-xl bg-primary-container flex items-center justify-center text-primary mt-1">
<span class="material-symbols-outlined" data-icon="description">description</span>
</div>
<div class="flex-1">
<label class="block text-[12px] font-bold text-secondary tracking-wider uppercase mb-0.5">Notas adicionales</label>
<textarea class="w-full bg-transparent border-none p-0 text-on-surface font-medium focus:ring-0 placeholder:text-on-surface-variant/40 resize-none" placeholder="Añade un comentario sobre este pago..." rows="3"></textarea>
</div>
</div>
</div>
<!-- Attachment Section -->
<div class="px-6 py-10 flex flex-col items-center justify-center border-b border-outline-variant bg-surface-container-lowest relative overflow-hidden">
<!-- Subtle brand watermark texture -->
<div class="absolute top-0 right-0 p-8 opacity-[0.03] pointer-events-none">
<div class="w-32 h-32 rounded-full bg-primary"></div>
</div>
<div class="w-20 h-20 rounded-full bg-primary-container flex items-center justify-center text-primary mb-4 shadow-sm">
<span class="material-symbols-outlined !text-4xl" data-icon="cloud_upload">cloud_upload</span>
</div>
<h3 class="font-bold text-on-surface text-lg">Adjuntar Comprobante</h3>
<p class="text-on-surface-variant text-sm text-center mt-1 mb-6 px-4">Sube una captura de pantalla o foto del recibo de transferencia.</p>
<button class="px-6 py-2.5 rounded-xl border-2 border-primary text-primary font-bold text-sm hover:bg-primary hover:text-white transition-all active:scale-95">
                    Seleccionar Archivo
                </button>
</div>
<!-- Review Section / Information Density -->
<div class="px-6 py-8 bg-surface-container-low">
<div class="flex items-center justify-between mb-4">
<span class="text-[12px] font-extrabold text-secondary tracking-widest uppercase">Resumen de Cuenta</span>
<span class="material-symbols-outlined text-primary text-sm" data-icon="info">info</span>
</div>
<div class="space-y-3">
<div class="flex justify-between text-sm">
<span class="text-on-surface-variant">Saldo Pendiente</span>
<span class="font-bold text-on-surface">$1,240.00</span>
</div>
<div class="flex justify-between text-sm">
<span class="text-on-surface-variant">Este Reporte</span>
<span class="font-bold text-primary">$0.00</span>
</div>
<div class="pt-3 border-t border-outline flex justify-between">
<span class="font-bold text-on-surface">Nuevo Saldo Estimado</span>
<span class="font-extrabold text-on-surface text-lg">$1,240.00</span>
</div>
</div>
</div>
</div>
<!-- Sticky Bottom Action -->
<div class="p-6 bg-white sticky bottom-0 border-t border-outline-variant">
<button class="w-full bg-primary py-4 rounded-xl text-white font-extrabold text-lg shadow-[0_4px_20px_rgba(37,99,235,0.25)] active:scale-[0.98] transition-transform flex items-center justify-center gap-3">
<span>Reportar Pago</span>
<span class="material-symbols-outlined !text-xl" data-icon="send">send</span>
</button>
</div>
</main>
<!-- Navigation Shell Placeholder (Suppressed for transactional flow) -->
<!-- The user is in a focused journey (Reporting payment), so global navigation is hidden as per UX guidelines -->
</body></html>
