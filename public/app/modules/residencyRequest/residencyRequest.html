<div id="residency-request-card" class="profile-card residency-request-module">
  <div class="card-header-with-icon">
    <div>
      <h3 class="profile-card-title">Vínculo con el Condominio</h3>
      <p class="profile-card-desc">Selecciona tu unidad para que la administración valide tu perfil de residente.</p>
    </div>
  </div>
  
  <div id="request-form-container">
    <div class="search-selection-group">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <label for="property-search-input" class="form-label">Buscar mi Casa / Unidad</label>
        <button type="button" id="btn-cancel-search" class="button-link">Cancelar</button>
      </div>
      <div class="search-input-wrapper">
        <svg class="search-icon-inside" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="property-search-input" class="form-input" placeholder="Escribe el número o calle..." autocomplete="off">
      </div>
      
      <!-- Lista de Sugerencias -->
      <div id="property-suggestions" class="suggestions-list hidden">
        <!-- Cargado dinámicamente -->
      </div>

      <!-- Unidades Seleccionadas (Lista de Chips) -->
      <div id="selected-properties-container" class="selected-chip-container">
        <span class="selection-label">Unidades a vincular:</span>
        <div id="selected-properties-list" class="properties-chips-grid">
          <!-- Chips cargados dinámicamente -->
        </div>
      </div>
    </div>

    <form id="residency-form" class="hidden">
      <!-- El property-id-hidden ahora se gestionará mediante un Set en el controlador -->
      <div class="form-actions" style="margin-top: 1.5rem;">
        <button type="submit" id="btn-submit-residency" class="button button-primary w-full">Enviar Solicitudes</button>
      </div>
    </form>
  </div>

  <div id="request-status-container" class="hidden">
    <div id="request-status-list">
      <!-- Lista de solicitudes enviadas (rendered by controller) -->
    </div>
    <div class="btn-show-search-wrap">
      <button type="button" id="btn-show-search" class="button-link">Solicitar otra unidad</button>
    </div>
  </div>
</div>
