<div class="module recovery" id="recoveryModule">
  <form class="recovery-form" id="recoveryForm">
    <h3 class="auth-title">Recuperar contraseña</h3>
    <label class="form-label" for="recoveryEmail">Email de recuperación</label>
    <div class="field">
      <input type="email" id="recoveryEmail" name="recoveryEmail" placeholder="tu@email.com" required />
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
        <path
          d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414zM0 4.697v7.104l5.803-3.558zM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586zm3.436-.586L16 11.801V4.697z" />
      </svg>
    </div>
    <div class="button-group">
      <input class="primary" type="submit" value="recuperar">
      <input class="secondary" type="button" value="Cancelar" id="forgotPasswordLinkCancel" onclick="window.location.href = '/login'">
    </div>
  </form>
  <div class="link-group">
    <a href="/login">volver al inicio sesión!</a>
  </div>
</div>
