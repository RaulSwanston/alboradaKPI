<div class="module signup" id="signupModule">
  <form class="signup-form" id="signupForm">
    <h3 class="auth-title">Nuevo Residente</h3>
    <label class="form-label" for="SignUpUser">Usuario</label>
    <div class="field">
      <input type="text" name="SignUpUser" placeholder="Tú nombre de usuario" required />
      <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 16 16">
        <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6" />
      </svg>
    </div>
    <label class="form-label" for="SignUpEmail">Correo</label>
    <div class="field">
      <input type="email" name="SignUpEmail" placeholder="tu@email.com" required />
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
        <path d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414zM0 4.697v7.104l5.803-3.558zM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586zm3.436-.586L16 11.801V4.697z" />
      </svg>
    </div>
    <label class="form-label" for="SignUpPassword">Contraseña</label>
    <div class="field">
      <input type="password" name="SignUpPassword" placeholder="******************" required />
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
        <path fill-rule="evenodd"
          d="M8 0c1.07 0 2.041.42 2.759 1.104l.14.14.062.08a.5.5 0 0 1-.71.675l-.076-.066-.216-.205A3 3 0 0 0 5 4v2h6.5A2.5 2.5 0 0 1 14 8.5v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4" />
      </svg>
    </div>
    <div id="error-message" class="error-message"></div>
    <div class="button-group">
      <input class="primary" type="submit" value="Registrame">
      <input class="secondary" type="button" value="Cancelar" id="signupButtonCancel" onclick="window.location.href = '/login'">
    </div>
  </form>
  <div class="separator"><span>O</span></div>
  <button class="button google-signin" id="googleSignupButton">
    <svg viewBox="-3 0 262 262" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid">
      <path d="M255.878 133.451c0-10.734-.871-18.567-2.756-26.69H130.55v48.448h71.947c-1.45 12.04-9.283 30.172-26.69 42.356l-.244 1.622 38.755 30.023 2.685.268c24.659-22.774 38.875-56.282 38.875-96.027" fill="#4285F4" />
      <path d="M130.55 261.1c35.248 0 64.839-11.605 86.453-31.622l-41.196-31.913c-11.024 7.688-25.82 13.055-45.257 13.055-34.523 0-63.824-22.773-74.269-54.25l-1.531.13-40.298 31.187-.527 1.465C35.393 231.798 79.49 261.1 130.55 261.1" fill="#34A853" />
      <path d="M56.281 156.37c-2.756-8.123-4.351-16.827-4.351-25.82 0-8.994 1.595-17.697 4.206-25.82l-.073-1.73L15.26 71.312l-1.335.635C5.077 89.644 0 109.517 0 130.55s5.077 40.905 13.925 58.602l42.356-32.782" fill="#FBBC05" />
      <path d="M130.55 50.479c24.514 0 41.05 10.589 50.479 19.438l36.844-35.974C195.245 12.91 165.798 0 130.55 0 79.49 0 35.393 29.301 13.925 71.947l42.211 32.783c10.59-31.477 39.891-54.251 74.414-54.251" fill="#EB4335" />
    </svg>
    <span>Continuar con Google</span>
  </button>
  <div class="link-group">
    <a href="/login">Ya tengo una cuenta, iniciar sesión!</a>
  </div>
</div>
