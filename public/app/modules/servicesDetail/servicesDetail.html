<div class="services-detail-container">
  <div class="detail-card">
    <div class="detail-header">
      <div class="detail-avatar-section">
        <div class="detail-avatar-container" id="detail-icon-trigger">
          <div class="detail-avatar-icon" id="detail-icon">📦</div>
        </div>
        <button type="button" class="detail-edit-icon-btn" id="btn-select-icon" title="Cambiar icono">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
        </button>
        <input type="hidden" id="selected-icon-url" name="iconUrl">
      </div>
      <div class="detail-info">
        <h2 id="detail-name" contenteditable="true" class="detail-name-editable">Cargando...</h2>
        <div class="detail-name-counter"><span id="name-counter">0</span>/80</div>
        <p id="detail-descriptionShort" contenteditable="true" class="detail-description-short" data-placeholder="Descripción corta del servicio"></p>
        <div class="detail-desc-counter"><span id="desc-counter">0</span>/200</div>
        <label class="detail-requestable-label">
          <input type="checkbox" id="edit-requestable-header" class="detail-requestable-checkbox">
          <span class="toggle-track">
            <span class="toggle-knob"></span>
          </span>
          <span class="label-text">Visible y solicitable por residentes</span>
        </label>
      </div>
      <div class="detail-amount-section">
        <div class="amount-display">
          <span class="amount-value" contenteditable="true" id="detail-amount"></span>
          <span class="amount-label">Monto Predeterminado</span>
        </div>
      </div>
    </div>

    <form id="form-edit-concept" class="detail-form">
      <div class="form-group hidden">
        <label for="edit-name">Nombre del Concepto</label>
        <input type="text" id="edit-name" required>
      </div>

      <div class="form-group hidden">
        <label for="edit-descriptionShort">Descripción Corta</label>
        <textarea id="edit-descriptionShort" rows="2" placeholder="Texto breve que se muestra en la tarjeta del servicio"></textarea>
      </div>

      <div class="form-group">
        <textarea id="edit-descriptionLong" placeholder="Descripción detallada del servicio"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group hidden">
          <label for="edit-amount">Monto Predeterminado ($)</label>
          <input type="number" id="edit-amount" step="0.01" min="0" required>
        </div>
        <div class="form-group hidden">
          <label for="edit-type">Tipo</label>
          <select id="edit-type"></select>
        </div>
      </div>

      <input type="checkbox" id="edit-recurring" style="display:none">

      <div class="form-group hidden">
        <label class="checkbox-label">
          <input type="checkbox" id="edit-requestable">
          Visible y solicitable por residentes
        </label>
      </div>
    </form>
  </div>

  <div class="button-group">
    <button type="submit" class="primary" id="btn-save">Guardar Cambios</button>
    <button type="button" class="secondary" id="btn-cancel">Cancelar</button>
  </div>

  <button type="button" class="recurring-option" id="btn-advanced-options">
    <div class="recurring-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </div>
    <div class="recurring-text">
      <span class="recurring-label">Opciones avanzadas</span>
      <span class="recurring-desc">Configuración adicional del concepto</span>
    </div>
    <svg class="chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708"/></svg>
  </button>

  <!-- Modal de selección de icono -->
  <div id="icon-modal-overlay" class="icon-modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Seleccionar Icono</h2>
        <p>Escribe el nombre del concepto para ver sugerencias de iconos.</p>
      </div>
      <div class="modal-body">
        <div class="field-group">
          <label for="icon-search-input">Buscar icono</label>
          <div class="input-icon-group">
            <input type="text" id="icon-search-input" placeholder="Ej. mantenimiento, limpieza, seguridad..." autocomplete="off">
            <div class="icon-selection-controls">
              <button type="button" id="btn-select-icon-modal" class="btn-icon-trigger" title="Icono seleccionado">
                <div id="selected-icon-preview" class="selected-icon-preview">
                  <span>?</span>
                </div>
              </button>
              <div class="color-picker-wrapper">
                <input type="color" id="icon-color" name="iconColor" value="#28bf63" title="Color del Icono">
              </div>
            </div>
          </div>
        </div>
        <div id="icon-results-panel" class="icon-results-panel">
          <div class="panel-header">
            <span id="search-status-text">Escribe para buscar iconos...</span>
            <button type="button" class="btn-close-panel" id="btn-close-icon-panel">×</button>
          </div>
          <div id="icon-results-grid" class="icon-results-grid">
            <div class="loading-icons">Escribe el nombre del concepto para ver sugerencias...</div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="btn-cancel-icon">Cancelar</button>
        <button type="button" class="btn-primary" id="btn-apply-icon" disabled>Aplicar</button>
      </div>
    </div>
  </div>

  <!-- Drawer de Opciones Avanzadas -->
  <div id="advanced-drawer-overlay" class="drawer-overlay hidden">
    <div class="drawer-panel">
      <div class="drawer-header">
        <h3>Opciones Avanzadas</h3>
        <button type="button" id="btn-close-drawer" class="drawer-close">×</button>
      </div>
      <div class="drawer-body">
        <div class="drawer-section">
          <label class="drawer-toggle-row">
            <div class="drawer-toggle-text">
              <span class="drawer-toggle-label">Cargo recurrente</span>
              <span class="drawer-toggle-desc">Se aplica automáticamente cada mes</span>
            </div>
            <label class="switch">
              <input type="checkbox" id="drawer-recurring">
              <span class="slider"></span>
            </label>
          </label>
        </div>

        <div class="drawer-section">
          <label class="drawer-field-label">Tipo de cuota</label>
          <select id="drawer-type-select" class="drawer-select"></select>
        </div>

        <button type="button" class="drawer-danger-btn" id="btn-delete">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          <span>Eliminar Concepto</span>
        </button>
      </div>
    </div>
  </div>
</div>
