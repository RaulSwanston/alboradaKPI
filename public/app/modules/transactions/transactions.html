<div class="transactions-summary-bar" id="transactions-summary-bar">
    <div class="summary-item">
        <span class="summary-label">Balance Neto del Periodo</span>
        <span class="summary-value" id="sum-total-net">--</span>
    </div>
</div>

<div class="module-header">
    <div class="header-filters">
        <!-- Fila 1: Buscador y Presets de Fecha -->
        <div class="filter-row-top">
            <div class="search-bar-inline">
                <input type="text" id="transactions-search" placeholder="Buscar por descripción o unidad...">
            </div>
            
            <div class="date-filters-group">
                <select id="date-preset-select" class="filter-select">
                    <option value="">Filtrar por tiempo...</option>
                    <option value="today">Hoy</option>
                    <option value="yesterday">Ayer</option>
                    <option value="last7days">Últimos 7 días</option>
                    <option value="last30days">Últimos 30 días</option>
                    <option value="thisMonth">Este mes</option>
                    <option value="lastMonth">Mes pasado</option>
                    <option value="last3months">Últimos 3 meses</option>
                    <option value="last6months">Últimos 6 meses</option>
                    <option value="thisYear">Este año</option>
                    <option value="lastYear">Año pasado</option>
                    <option value="all">Todo el tiempo</option>
                    <option value="custom">Rango personalizado...</option>
                </select>

                <div id="custom-date-container" class="custom-dates hidden">
                    <input type="date" id="date-start">
                    <span>al</span>
                    <input type="date" id="date-end">
                    <button id="btn-apply-dates" class="btn-apply-dates">Buscar</button>
                </div>
            </div>
        </div>

        <!-- Fila 2: Chips de Tipo (Dinámicos) -->
        <div class="chips-container" id="transaction-filters">
            <!-- Los chips se inyectarán aquí -->
        </div>
    </div>
</div>

<!-- Nueva Estructura de Tabla -->
<div class="transactions-table-container">
    <div class="transactions-table">
        <!-- Encabezado de Tabla (Solo Escritorio) -->
        <div class="table-header">
            <div class="col-date">Fecha</div>
            <div class="col-desc">Descripción / Concepto</div>
            <div class="col-type">Tipo</div>
            <div class="col-prop">Unidad</div>
            <div class="col-amount" style="text-align: right; padding-right: 2rem;">Monto</div>
            <div class="col-actions">Acciones</div>
        </div>

        <!-- Cuerpo de la Tabla / Lista de Globos -->
        <div id="transactions-list">
            <!-- Las filas se inyectarán aquí -->
        </div>
    </div>

    <!-- Paginación integrada en el footer de la tabla -->
    <div class="table-footer">
        <div class="pagination" id="pagination-controls">
            <!-- Botones de página se inyectarán aquí -->
        </div>
    </div>
</div>
