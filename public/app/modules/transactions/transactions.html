<div class="transactions-summary-bar" id="transactions-summary-bar">
    <div class="summary-item">
        <span class="summary-label">Balance Neto del Periodo</span>
        <span class="summary-value" id="sum-total-net">$0.00</span>
    </div>
</div>

<div class="module-header">
    <div class="header-main">
        <div class="title-group">
            <h2>Libro Mayor (Maestro)</h2>
            <p class="subtitle">Historial completo de movimientos contables.</p>
        </div>
        <div class="actions">
            <a href="/dashboard/transactions/new" class="btn-primary" data-view="dashboard" id="btn-new-transaction">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"></path>
                </svg>
                Nuevo Movimiento
            </a>
        </div>
    </div>

    <div class="header-filters">
        <div class="filter-row-top">
            <div class="search-bar-inline">
                <input type="text" id="transactions-search" placeholder="Buscar por unidad o descripción...">
            </div>
            
            <div class="date-filters-group">
                <select id="date-preset-select" class="filter-select">
                    <option value="all">Todo el tiempo</option>
                    <option value="today">Hoy</option>
                    <option value="yesterday">Ayer</option>
                    <option value="last7days">Últimos 7 días</option>
                    <option value="last30days">Últimos 30 días</option>
                    <option value="thisMonth">Este mes</option>
                    <option value="lastMonth">Mes pasado</option>
                    <option value="last3months">Últimos 3 meses</option>
                    <option value="last6months">Últimos 6 meses</option>
                    <option value="thisYear">Este año</option>
                    <option value="lastYear">Año pasado</option>
                    <option value="custom">Personalizado / Rango</option>
                </select>

                <div id="custom-date-container" class="custom-dates hidden">
                    <input type="date" id="date-start">
                    <span>a</span>
                    <input type="date" id="date-end">
                    <button id="btn-apply-dates" class="btn-apply-dates">Buscar</button>
                </div>
            </div>
        </div>

        <div class="chips-container" id="transaction-filters">
            <!-- Se generará dinámicamente según los datos del periodo -->
        </div>
    </div>
</div>

<div class="transactions-grid" id="transactions-list">
    <!-- Cargando... -->
</div>

<div class="pagination-container" id="pagination-controls">
    <!-- Botones de página se inyectarán aquí -->
</div>
