<div class="transactions-summary-bar" id="transactions-summary-bar">
    <div class="summary-item">
        <span class="summary-label"><!-- ::i18n.modules.transactions.netBalance --></span>
        <span class="summary-value" id="sum-total-net">--</span>
    </div>
</div>

<div class="transactions-header">
    <div class="header-filters">
        <div class="filter-row-top">
            <div class="search-bar-inline">
                <input type="text" id="transactions-search">
            </div>
            
            <div class="date-filters-group">
                <select id="date-preset-select" class="filter-select">
                    <option value=""><!-- ::i18n.modules.transactions.filterTime --></option>
                    <option value="today"><!-- ::i18n.modules.transactions.presetToday --></option>
                    <option value="yesterday"><!-- ::i18n.modules.transactions.presetYesterday --></option>
                    <option value="last7days"><!-- ::i18n.modules.transactions.presetLast7 --></option>
                    <option value="last30days"><!-- ::i18n.modules.transactions.presetLast30 --></option>
                    <option value="thisMonth"><!-- ::i18n.modules.transactions.presetThisMonth --></option>
                    <option value="lastMonth"><!-- ::i18n.modules.transactions.presetLastMonth --></option>
                    <option value="last3months"><!-- ::i18n.modules.transactions.presetLast3 --></option>
                    <option value="last6months"><!-- ::i18n.modules.transactions.presetLast6 --></option>
                    <option value="thisYear"><!-- ::i18n.modules.transactions.presetThisYear --></option>
                    <option value="lastYear"><!-- ::i18n.modules.transactions.presetLastYear --></option>
                    <option value="all"><!-- ::i18n.modules.transactions.presetAll --></option>
                    <option value="custom"><!-- ::i18n.modules.transactions.presetCustom --></option>
                </select>

                <div id="custom-date-container" class="custom-dates hidden">
                    <input type="date" id="date-start">
                    <span><!-- ::i18n.modules.transactions.dateTo --></span>
                    <input type="date" id="date-end">
                    <button id="btn-apply-dates" class="btn-apply-dates"><!-- ::i18n.modules.transactions.applyDate --></button>
                </div>
            </div>
        </div>

        <div class="chips-container" id="transaction-filters">
        </div>
    </div>
    <a href="/dashboard/transactions/new" data-view="dashboard" data-role-required="admin" class="btn-new-transaction">
        <!-- ::i18n.modules.transactions.newTransaction -->
    </a>
</div>

<div class="transactions-table-container">
    <div class="transactions-table">
        <div class="table-header">
            <div class="col-date"><!-- ::i18n.modules.transactions.colDate --></div>
            <div class="col-desc"><!-- ::i18n.modules.transactions.colDescription --></div>
            <div class="col-type"><!-- ::i18n.modules.transactions.colType --></div>
            <div class="col-prop"><!-- ::i18n.modules.transactions.colProperty --></div>
            <div class="col-amount"><!-- ::i18n.modules.transactions.colAmount --></div>
            <div class="col-actions"><!-- ::i18n.modules.transactions.colActions --></div>
        </div>

        <div id="transactions-list">
        </div>
    </div>

    <div class="table-footer">
        <div class="pagination" id="pagination-controls">
        </div>
    </div>
</div>

<div id="receipt-modal" class="modal-overlay hidden">
  <div class="modal-content receipt-modal-content">
    <div class="receipt-header">
      <h2><!-- ::i18n.modules.transactions.receiptTitle --></h2>
      <button class="modal-close-btn" id="receipt-modal-close">&times;</button>
    </div>
    <div class="receipt-tabs" id="receipt-tabs">
      <button class="receipt-tab active" data-tab="current"><!-- ::i18n.modules.transactions.receiptTabCurrent --></button>
      <button class="receipt-tab" data-tab="physical"><!-- ::i18n.modules.transactions.receiptTabPhysical --></button>
    </div>
    <div id="receipt-body" class="receipt-body receipt-panel active" data-panel="current">
    </div>
    <div id="receipt-physical-body" class="receipt-body receipt-panel" data-panel="physical">
    </div>
    <div class="receipt-actions">
      <button class="button button-accent" id="btn-print-receipt"><!-- ::i18n.modules.transactions.receiptPrint --></button>
    </div>
  </div>
</div>
