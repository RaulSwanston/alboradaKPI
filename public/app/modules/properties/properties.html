<header class="new-concept-header">
  <button class="btn-back" onclick="history.back()" aria-label="Volver">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <div class="header-titles">
    <h1>Propiedades</h1>
    <span>Gestión de Unidades</span>
  </div>
</header>

<div class="properties-summary-bar">
    <div class="summary-item-simple">
        <div class="item-icon-mini debt-color">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        </div>
        <div class="item-data">
            <span class="label">Total Pendiente</span>
            <span class="value debt" id="prop-total-debt">$0.00</span>
        </div>
    </div>
    
    <div class="summary-divider"></div>
    
    <div class="summary-item-simple">
        <div class="item-icon-mini count-color">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </div>
        <div class="item-data">
            <span class="label">Unidades</span>
            <span class="value" id="prop-count">0</span>
        </div>
    </div>
</div>

<!-- ::module.search -->

<div class="properties-filters">
    <button class="filter-chip active" data-filter="all">Todos</button>
    <button class="filter-chip" data-filter="debt">Pendientes</button>
    <button class="filter-chip" data-filter="paid">Al día</button>
</div>

<div class="dashboard-properties-grid">
  <div id="properties-list-container">
    <!-- Las propiedades se insertarán aquí como tarjetas -->
    <div class="loading-text">Cargando propiedades...</div>
  </div>
</div>
