<header class="new-concept-header">
  <button class="btn-back" onclick="history.back()" aria-label="Volver">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <div class="header-titles">
    <h1><!-- ::i18n.modules.providers.title --></h1>
    <span><!-- ::i18n.modules.providers.subtitle --></span>
  </div>
</header>

<div class="providers-summary-bar">
  <div class="summary-item-simple">
    <div class="item-icon-mini count-color">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    </div>
    <div class="item-data">
      <span class="label"><!-- ::i18n.modules.providers.total --></span>
      <span class="value" id="providers-count">0</span>
    </div>
  </div>
</div>

<!-- ::module.search -->

<div class="dashboard-providers-grid">
  <div id="providers-list-container">
    <!-- Las proveedores se insertarán aquí como tarjetas -->
    <div class="loading-text">Cargando proveedores...</div>
  </div>
</div>
