<section class="payment-history-wrapper">
  <header class="detail-header">
    <div class="header-left">
      <button class="btn-back" onclick="router.navigate('/dashboard/resumen')" aria-label="<!-- ::i18n.paymentHistory.back -->">
        <div class="icon-slot" data-icon="chevron-left"></div>
      </button>
      <h1 class="header-title"><!-- ::i18n.paymentHistory.title --></h1>
    </div>
  </header>

  <div id="history-filters" class="history-filters hidden" role="tablist">
    <button type="button" class="history-filter active" data-filter="all" role="tab"><!-- ::i18n.paymentHistory.filterAll --></button>
    <button type="button" class="history-filter" data-filter="pending_verification" role="tab"><!-- ::i18n.paymentHistory.filterPending --></button>
    <button type="button" class="history-filter" data-filter="approved" role="tab"><!-- ::i18n.paymentHistory.filterApproved --></button>
    <button type="button" class="history-filter" data-filter="rejected" role="tab"><!-- ::i18n.paymentHistory.filterRejected --></button>
  </div>

  <div id="history-list" class="history-list">
    <div class="loading-state">
      <p><!-- ::i18n.paymentHistory.loading --></p>
    </div>
  </div>

  <div id="history-empty" class="empty-state hidden">
    <div class="empty-icon-wrap">
      <div class="icon-slot-lg" data-icon="receipt"></div>
    </div>
    <p class="empty-title"><!-- ::i18n.paymentHistory.emptyTitle --></p>
    <p class="empty-desc"><!-- ::i18n.paymentHistory.emptyDesc --></p>
  </div>

  <!-- Visor del comprobante subido por el residente -->
  <div id="history-receipt-modal" class="history-receipt-modal hidden" role="dialog" aria-modal="true">
    <button type="button" id="history-receipt-close" class="history-receipt-close">
      <span class="history-receipt-close-icon" aria-hidden="true">&times;</span>
    </button>
    <div id="history-receipt-stage" class="history-receipt-stage">
      <img id="history-receipt-image" class="history-receipt-image" alt="" draggable="false">
    </div>
    <div id="history-receipt-controls" class="history-receipt-controls" role="group" hidden>
      <button type="button" id="history-receipt-zoom-out" class="history-receipt-zoom">&minus;</button>
      <button type="button" id="history-receipt-zoom-reset" class="history-receipt-zoom history-receipt-zoom-reset">100%</button>
      <button type="button" id="history-receipt-zoom-in" class="history-receipt-zoom">+</button>
    </div>
  </div>
</section>
