<div class="notifications-feed-module">
  <div class="feed-header">
    <h2 class="feed-title">Bandeja de Entrada</h2>
    <p class="feed-subtitle">Tareas y actualizaciones que requieren tu atención.</p>
  </div>

  <div id="notifications-container" class="notifications-list">
    <!-- Cargado dinámicamente -->
    <div class="loading-state">Consultando notificaciones...</div>
  </div>

  <!-- Template para ítems de notificación -->
  <template id="notification-item-template">
    <div class="notification-item">
      <div class="notification-icon-wrapper">
        <!-- Icono dinámico -->
      </div>
      <div class="notification-content">
        <p class="notification-message"></p>
        <span class="notification-time"></span>
      </div>
      <button class="notification-action-btn" title="Atender ahora">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </template>

  <div id="no-notifications" class="empty-feed hidden">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
    </div>
    <p>Todo al día. No tienes notificaciones pendientes.</p>
  </div>
</div>
